[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pwnx"
version = "0.4.0"
description = "Declarative Python exploit specifications, compiled into inspectable interactions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
pwnx = "pwnx.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=7.4",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pwnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

